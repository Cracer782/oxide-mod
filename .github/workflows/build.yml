name: Build Android .so

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Sanity check
        run: |
          test -f CMakeLists.txt || { echo "CMakeLists.txt missing"; exit 1; }
          test -f main.cpp || { echo "main.cpp missing"; exit 1; }

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Export NDK env
        run: echo "ANDROID_NDK=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: Fetch ImGui
        run: |
          git clone --depth 1 --branch v1.90.9 https://github.com/ocornut/imgui.git _imgui
          mkdir -p imgui
          cp _imgui/imgui.cpp _imgui/imgui_draw.cpp _imgui/imgui_tables.cpp _imgui/imgui_widgets.cpp imgui/
          cp _imgui/imgui.h _imgui/imgui_internal.h _imgui/imconfig.h _imgui/imstb_*.h imgui/
          cp _imgui/backends/imgui_impl_android.cpp _imgui/backends/imgui_impl_android.h imgui/
          cp _imgui/backends/imgui_impl_vulkan.cpp _imgui/backends/imgui_impl_vulkan.h imgui/
          rm -rf _imgui

      - name: Configure
        run: |
          cmake -S . -B build --log-level=WARNING \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_TOOLCHAIN=clang \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_STL=c++_static \
            -DCMAKE_CXX_FLAGS="-O2 -fvisibility=hidden -fvisibility-inlines-hidden"

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Verify Library Exists
        run: |
          test -f build/libiptade.so || { echo "libiptade.so not found in build directory"; exit 1; }
          file build/libiptade.so
          ls -la build/libiptade.so

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: iptade-so-arm64-v8a
          path: build/libiptade.so
          if-no-files-found: error
          retention-days: 14
          
